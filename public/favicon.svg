<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#ff6b35"/>
  
  <!-- Concrete block/foundation icon -->
  <!-- Top layer -->
  <rect x="24" y="48" width="80" height="16" fill="#ffffff" opacity="0.95"/>
  <!-- Middle layer -->
  <rect x="32" y="64" width="64" height="16" fill="#ffffff" opacity="0.9"/>
  <!-- Bottom layer -->
  <rect x="40" y="80" width="48" height="16" fill="#ffffff" opacity="0.85"/>
  
  <!-- Construction lines/texture -->
  <line x1="64" y1="48" x2="64" y2="64" stroke="#ff6b35" stroke-width="2" opacity="0.3"/>
  <line x1="64" y1="64" x2="64" y2="80" stroke="#ff6b35" stroke-width="2" opacity="0.3"/>
  
  <!-- Small accent dots for texture -->
  <circle cx="48" cy="56" r="2" fill="#ff6b35" opacity="0.4"/>
  <circle cx="80" cy="56" r="2" fill="#ff6b35" opacity="0.4"/>
  <circle cx="48" cy="72" r="2" fill="#ff6b35" opacity="0.4"/>
  <circle cx="80" cy="72" r="2" fill="#ff6b35" opacity="0.4"/>
</svg>
